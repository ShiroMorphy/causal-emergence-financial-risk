[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-emergence-finance"
version = "0.1.0"
description = "When the Market Becomes More Than Its Parts: Causal Emergence as a Novel Measure of Systemic Financial Risk"
authors = [{ name = "Felipe Mora Rojas" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "pymanopt>=2.2.0",
    "yfinance>=0.2.30",
    "pandas-datareader>=0.10.0",
    "fredapi>=0.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0"
]

[tool.setuptools.packages.find]
where = ["src"]
